version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: agrisatai-minio
    ports:
      - "9000:9000"  # API port
      - "9001:9001"  # Web UI port
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # Optional: Setup script container to automatically create buckets
  minio-setup:
    image: minio/mc:latest
    container_name: agrisatai-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/raw --ignore-existing;
      /usr/bin/mc mb myminio/processed --ignore-existing;
      /usr/bin/mc mb myminio/models --ignore-existing;
      echo 'Buckets created successfully.';
      "

volumes:
  minio_data:
